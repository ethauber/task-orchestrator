[project]
name = "task-orchestrator"
version = "0.1.0"
description = ""
authors = [
    {name = "Eli H",email = "21344568+ethauber@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi (>=0.120.1,<0.121.0)",
    "langchain (>=1.0.2,<2.0.0)",
    "langchain-ollama (>=1.0.0,<2.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "ollama (>=0.6.0,<0.7.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.0.44,<3.0.0)",
    "aiosqlite (>=0.21.0,<0.22.0)",
    "langgraph (>=1.0.4,<2.0.0)",
    "mcp (>=1.23.3,<2.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "duckduckgo-search (>=8.1.1,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "alembic (>=1.17.2,<2.0.0)"
]
